name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 综测计算层单测
        run: node test/calc.test.js
      - name: 转专业计算层单测
        run: node test/transfer.test.js
      - name: 存储层单测
        run: node test/storage.test.js
